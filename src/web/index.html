<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <title>PPM — Personal Project Manager</title>
    <link rel="icon" id="ppm-favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%0A%20%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%233b82f6%22%2F%3E%0A%20%20%3Ctext%20x%3D%2216%22%20y%3D%2222%22%20text-anchor%3D%22middle%22%20font-family%3D%22system-ui%2Csans-serif%22%20font-weight%3D%22700%22%20font-size%3D%2211%22%20fill%3D%22white%22%3EPPM%3C%2Ftext%3E%0A%3C%2Fsvg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="text-text font-sans antialiased" style="background: var(--bg)">
    <!-- FOUC guard: apply the persisted theme mode before first paint.
         Full token set is applied by React (theme/apply-theme.ts) on mount. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ppm-settings");
          var s = raw ? JSON.parse(raw) : {};
          var mode = s.themeMode || s.theme || "system";
          if (mode === "system") {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var root = document.documentElement;
          root.classList.toggle("dark", mode === "dark");
          root.classList.toggle("light", mode === "light");
          if (mode === "light") {
            var L = {
              "--bg": "radial-gradient(120% 120% at 0% 0%, #f3f7ff 0%, #eef2fb 55%, #e8edf7 100%)",
              "--bg-solid": "#f3f7ff",
              "--rail": "rgba(255,255,255,0.62)",
              "--panel": "rgba(255,255,255,0.62)",
              "--panel-2": "rgba(255,255,255,0.94)",
              "--border": "rgba(20,30,60,0.12)",
              "--border-soft": "rgba(20,30,60,0.07)",
              "--text": "#0f1a33",
              "--text-2": "#4a5878",
              "--text-3": "#8391ad",
              "--accent": "#2f6bff",
              "--accent-2": "#7c4dff",
            };
            for (var k in L) root.style.setProperty(k, L[k]);
          }
        } catch (e) {}
      })();
    </script>
    <div id="portal" style="position: fixed; left: 0; top: 0; z-index: 9999;" /></div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
    <!-- Boot watchdog: the last resort, and the only code that can still run.
         The entry's module graph is ~39 separately-hashed chunks, and if any one
         of them 404s — an upgrade replaced dist/web, or a stale index.html is
         still naming last week's hashes — the entry module never executes. No
         React, no error boundary, no listener: `#root` stays empty and the page
         shows nothing but the body's background. That is the white screen, and
         nothing bundled can report it, because nothing bundled ran. Hence
         inline, dependency-free, and gated on the flag main.tsx sets: a boundary
         inside React already covers the case where the entry *did* run. -->
    <script>
      (function () {
        var KEY = "ppm:boot-retry";
        // Every cache, not just this app's: the stale index.html that named the
        // missing hashes comes from the service worker's *precache*, which is
        // workbox's to name. It repopulates itself on the next activation.
        function purge() {
          if (!window.caches) return Promise.resolve();
          return caches
            .keys()
            .then(function (names) { return Promise.all(names.map(function (n) { return caches.delete(n); })); })
            .catch(function () {});
        }
        function panic() {
          // The wrapper carries its own background: if the stylesheet was one of
          // the chunks that went missing, `var(--bg)` on <body> resolves to
          // nothing and dark-mode text would be white on white.
          document.getElementById("root").innerHTML =
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;' +
            'background:var(--bg-solid,#0a0e17);color:var(--text,#eaeefb);font:16px/1.5 system-ui,sans-serif">' +
            '<div role="alert" style="width:100%;max-width:440px;background:var(--panel,#141820);' +
            'border:1px solid var(--border,rgba(255,255,255,0.12));border-radius:18px;padding:24px">' +
            '<h1 style="margin:0;font-size:18px;font-weight:600">PPM could not finish loading</h1>' +
            '<p style="margin:12px 0 0;color:var(--text-2,#9aa6c2)">Part of the app is missing from the server, ' +
            'which usually means it was replaced by an upgrade. Reloading fetches the current version.</p>' +
            '<button id="ppm-boot-retry" type="button" style="min-height:44px;width:100%;margin-top:20px;' +
            'padding:0 20px;border:0;border-radius:12px;background:var(--accent,#5b8cff);' +
            'color:var(--accent-fg,#fff);font:inherit;font-weight:600;cursor:pointer">Reload</button>' +
            "</div></div>";
          document.getElementById("ppm-boot-retry").onclick = function () {
            try { sessionStorage.removeItem(KEY); } catch (e) {}
            purge().then(function () { location.reload(); });
          };
        }
        function check() {
          // Module scripts execute before `load`, so a flag still unset here is
          // never going to be set — this cannot misfire on a slow boot.
          if (window.__ppmEntryRan) return;
          var retried;
          try {
            retried = sessionStorage.getItem(KEY) === "1";
            sessionStorage.setItem(KEY, "1");
          } catch (e) {
            // No storage means no way to count attempts, and an uncounted
            // reload is a loop. Go straight to the message.
            retried = true;
          }
          // One silent attempt first: index.html is served `no-cache`, so a
          // reload with this origin's caches dropped is exactly how a tab
          // holding an upgraded-away chunk list heals itself.
          if (!retried) { purge().then(function () { location.reload(); }); return; }
          panic();
        }
        window.addEventListener("load", function () { setTimeout(check, 4000); });
      })();
    </script>
    <!-- Eruda: mobile console for debugging. Activate with ?debug in URL -->
    <script>
      if (/debug=true|debug(&|$)/.test(location.search)) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda';
        s.onload = function () { eruda.init(); };
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
